name: MLOps Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:    # Allow manual trigger

env:
  DOCKER_IMAGE: heart-disease-api
  DOCKER_TAG: ${{ github.sha }}
  PYTHONUTF8: "1"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run the full ML training pipeline
  # ─────────────────────────────────────────────
  train:
    name: Train & Evaluate Models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing stage
        run: python src/preprocess.py

      - name: Run training stage
        run: python src/train.py

      # Fails the pipeline (exit 1) if F1 < evaluate.pass_threshold in params.yaml
      - name: Run evaluation stage (quality gate)
        run: python src/evaluate.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/champion_model.pkl
            models/results_summary.json
            models/evaluation.json
          retention-days: 30

      - name: Upload processed data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/
          retention-days: 7

      - name: Display evaluation results
        run: |
          echo "===== Evaluation Results ====="
          cat models/evaluation.json

  # ─────────────────────────────────────────────
  # Job 2: Build & push Docker image
  # ─────────────────────────────────────────────
  docker:
    name: Build & push Docker Image
    runs-on: ubuntu-latest
    needs: train          # Only runs if training + quality gate passed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Download processed data artifacts
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push on real pushes (PRs from forks have no secrets)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: Deploy smoke test on a throwaway Kubernetes (kind) cluster
  # ─────────────────────────────────────────────
  deploy-test:
    name: Kubernetes deploy smoke test
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for deployments to be ready
        run: |
          kubectl rollout status deployment/heart-disease-streamlit --timeout=300s
          kubectl rollout status deployment/prometheus --timeout=180s
          kubectl rollout status deployment/grafana --timeout=180s

      - name: Show cluster state
        if: always()
        run: kubectl get pods,svc -o wide
