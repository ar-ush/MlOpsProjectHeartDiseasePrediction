apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Scrape Streamlit Prometheus port 8001
      - job_name: 'heart-disease-streamlit'
        static_configs:
          - targets: ['heart-disease-streamlit-service:8001']
        metrics_path: /metrics
